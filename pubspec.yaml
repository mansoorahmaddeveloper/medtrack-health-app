name: medtrack
description: MedTrack — continuity-of-care and family monitoring (offline-first patient app).
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.11.4

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  flutter_riverpod: ^2.6.1
  go_router: ^14.8.1
  drift: ^2.26.0
  sqlite3_flutter_libs: ^0.5.32
  path_provider: ^2.1.5
  path: ^1.9.1
  uuid: ^4.5.1
  intl: ^0.20.2
  flutter_local_notifications: ^19.0.0
  timezone: ^0.10.0
  image_picker: ^1.1.2
  pdf: ^3.11.3
  share_plus: ^10.1.4
  qr_flutter: ^4.1.0
  supabase_flutter: ^2.9.0
  connectivity_plus: ^6.1.4
  flutter_secure_storage: ^9.2.4
  fl_chart: ^0.70.2
  collection: ^1.19.1
  equatable: ^2.0.7
  google_fonts: ^6.2.1
  url_launcher: ^6.3.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  drift_dev: ^2.26.0
  build_runner: ^2.4.15
  mocktail: ^1.0.4

flutter:
  uses-material-design: true
